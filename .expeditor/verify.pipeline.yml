---
expeditor:
  defaults:
    buildkite:
      retry:
        automatic:
          limit: 1
      timeout_in_minutes: 60

steps:

- label: ":windows: Verify gem + test with Chef 18 (Omnibus + Habitat) - Ruby 3.1.7"
  commands:
    - .expeditor/ci/verify_gem.ps1
  expeditor:
    executor:
      docker:
        host_os: windows
        image: rubydistros/windows-2019:3.1.7
        shell: [ "powershell", "-Command" ]
        environment:
          - HAB_AUTH_TOKEN
          - CHEF_LICENSE_KEY

- label: ":windows: Verify gem + test with Chef 19 (Habitat) - Ruby 3.4"
  commands:
    - .expeditor/ci/verify_gem.ps1
  expeditor:
    executor:
      docker:
        host_os: windows
        image: rubydistros/windows-2019:3.4
        shell: [ "powershell", "-Command" ]
        environment:
          - HAB_AUTH_TOKEN
